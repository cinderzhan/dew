<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DEW — D Logo Exploration</title>
  <style>
    :root{--bg:#080908;--fg:#f4f5f2;--muted:#838781;--line:#242724;--panel:#101210}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:64px 28px 80px}header{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:32px}h1{margin:0;font-size:clamp(44px,8vw,92px);font-weight:500;letter-spacing:-.07em}.eyebrow,.num{font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--muted);background:transparent;cursor:pointer}button.active,button:hover{background:var(--fg);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}article{background:var(--panel);min-height:390px;padding:22px;display:flex;flex-direction:column}.stage{flex:1;display:grid;place-items:center;border-radius:2px;transition:.35s}.stage img{width:148px;height:148px;color:inherit;filter:var(--logo-filter,none);transition:transform .45s cubic-bezier(.2,.8,.2,1)}article:hover img{transform:scale(1.08) rotate(-2deg)}h2{font-size:18px;margin:20px 0 7px;font-weight:550}p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;max-width:37ch}.links{display:flex;gap:12px;margin-top:16px}.links a{font:10px ui-monospace,monospace;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--muted)}body.light{--bg:#f1f2ee;--fg:#111210;--muted:#686c67;--line:#d6d8d2;--panel:#fafbf8}body.light .stage img{filter:none}body.dark .stage img{filter:invert(1)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{grid-template-columns:1fr;gap:22px}.controls{justify-content:flex-start}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="dark"><main class="wrap"><header><div><div class="eyebrow">D / Symbol study · 2026</div><h1>DEW</h1></div><div class="controls"><button class="active" data-theme="dark">Void</button><button data-theme="light">Paper</button></div></header><section class="grid" id="grid"></section></main>
<script>
const logos=[
['01','Continuum','一笔式的圆角骨架，识别直接、气质冷静，适合作为主品牌标。','d01-continuum.svg'],
['02','Droplet Chain','胶囊模块沿轮廓流动，并以水滴节点收尾，传达连接与创造力。','d02-droplet-chain.svg'],
['03','Soft Cut','厚实 D 形中切出柔和负空间，小尺寸依然清晰，最具图标感。','d03-cutout.svg'],
['04','Orbit','清晰 D 框架与偏置圆点形成张力，像一个持续扩展的系统。','d04-orbit.svg'],
['05','Modular','九个圆角单元拼成 D，表达模块化产品、协作与可组合性。','d05-modular.svg'],
['06','Dewpoint','紧凑轮廓里藏一颗露珠节点，抽象、友好且更具专属性。','d06-dewpoint.svg']];
document.querySelector('#grid').innerHTML=logos.map(x=>`<article><span class="num">D—${x[0]}</span><div class="stage"><img src="svg/${x[3]}" alt="${x[1]} DEW D logo"></div><h2>${x[1]}</h2><p>${x[2]}</p><div class="links"><a href="svg/${x[3]}" download>SVG ↓</a><a href="png/${x[3].replace('.svg','.png')}" download>PNG ↓</a></div></article>`).join('');
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.theme;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});
</script></body></html>
