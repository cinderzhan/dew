    <clipPath id="sq"><path d="M512 0C150 0 0 150 0 512s150 512 512 512 512-150 512-512S874 0 512 0z"/></clipPath>
  </defs>
  <g clip-path="url(#sq)"><rect width="1024" height="1024" fill="#FFFFFF"/></g>
  <!-- 露珠：上尖下圆，几何干净 -->
  <path d="M512 246 C512 246 354 458 354 598 a158 158 0 1 0 316 0 C670 458 512 246 512 246 Z" fill="#111111"/>
